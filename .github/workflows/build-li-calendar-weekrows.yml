name: Build liCalendar Week Rows

# Build trigger for custom Windows installer
on:
  push:
    branches: [master]
    paths:
      - 'weekrows.patch'
      - '.github/workflows/build-li-calendar-weekrows.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout build repository
        uses: actions/checkout@v4

      - name: Get upstream liCalendar v1.0.0 and apply custom changes
        shell: pwsh
        run: |
          git clone --branch v1.0.0 --depth 1 https://github.com/CrankZ/li-calendar.git app
          Copy-Item "$env:GITHUB_WORKSPACE\weekrows.patch" "$env:GITHUB_WORKSPACE\app\weekrows.patch"
          Set-Location "$env:GITHUB_WORKSPACE\app"
          git apply --check weekrows.patch
          git apply weekrows.patch

          $weekFile = "src/utils/calendar/calendarWeekNumber.ts"
          (Get-Content $weekFile) | Where-Object { $_ -notmatch 'const weekYear = rowEnd\.year\(\);' } | Set-Content -Encoding utf8 $weekFile

          # Fix the original popup auto-resize logic for high-DPI Windows displays.
          # Use Tauri LogicalSize instead of manually multiplying by scaleFactor,
          # and size from the larger of the element box and its scroll extent.
          $resizeFile = "src/hooks/calender/useTauriCalendarResize.ts"
          $lines = [System.Collections.Generic.List[string]](Get-Content $resizeFile)
          for ($i = 0; $i -lt $lines.Count; $i++) {
            if ($lines[$i] -eq "import { PhysicalSize } from '@tauri-apps/api/dpi';") {
              $lines[$i] = "import { LogicalSize } from '@tauri-apps/api/dpi';"
              break
            }
          }
          $start = $lines.IndexOf('      const factor = await window.scaleFactor();')
          $end = $lines.IndexOf('      await window.setSize(new PhysicalSize(physicalWidth, physicalHeight));')
          if ($start -lt 0 -or $end -lt $start) { throw 'Could not locate original resize block.' }
          for ($i = $end; $i -ge $start; $i--) { $lines.RemoveAt($i) }
          $replacement = [string[]]@(
            '      const rect = el.getBoundingClientRect();',
            '      const width = Math.ceil(Math.max(rect.width, el.offsetWidth, el.scrollWidth)) + 2;',
            '      const height = Math.ceil(Math.max(rect.height, el.offsetHeight, el.scrollHeight)) + 2;',
            '',
            '      await window.setSize(new LogicalSize(width, height));'
          )
          $lines.InsertRange($start, $replacement)
          Set-Content -Encoding utf8 $resizeFile $lines

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.34.5
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'
          cache-dependency-path: app/pnpm-lock.yaml

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install frontend dependencies
        shell: pwsh
        working-directory: app
        run: pnpm install --frozen-lockfile

      - name: Type check
        shell: pwsh
        working-directory: app
        run: pnpm typecheck

      - name: Build Windows installer
        shell: pwsh
        working-directory: app
        run: pnpm tauri build

      - name: Collect installer
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "$env:GITHUB_WORKSPACE\release" | Out-Null
          $installer = Get-ChildItem "$env:GITHUB_WORKSPACE\app\src-tauri\target\release\bundle\nsis\*.exe" | Select-Object -First 1
          if (-not $installer) { throw 'NSIS installer was not generated.' }
          Copy-Item $installer.FullName "$env:GITHUB_WORKSPACE\release\liCalendar_1.0.0_weekrows_dpi_x64-setup.exe"

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: liCalendar-weekrows-dpi-windows
          path: release/liCalendar_1.0.0_weekrows_dpi_x64-setup.exe
          if-no-files-found: error

      - name: Publish build release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: li-calendar-weekrows-v1.0.0
          name: liCalendar 1.0.0 - Week Rows
          prerelease: true
          body: |
            Custom build based on CrankZ/li-calendar v1.0.0.
            Adds a week-number column on the left of each calendar row, W0/W1 configuration, and DPI-safe popup auto sizing for Windows.
          files: release/liCalendar_1.0.0_weekrows_dpi_x64-setup.exe
