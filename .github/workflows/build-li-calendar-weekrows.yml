name: Build customized liCalendar

on:
  push:
    branches: [master]
    paths:
      - 'li-calendar-custom/**'
      - '.github/workflows/build-li-calendar-weekrows.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.34.5
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'
          cache-dependency-path: li-calendar-custom/pnpm-lock.yaml

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install frontend dependencies
        shell: pwsh
        working-directory: li-calendar-custom
        run: pnpm install --frozen-lockfile

      - name: Type check
        shell: pwsh
        working-directory: li-calendar-custom
        run: pnpm typecheck

      - name: Build Windows installer
        shell: pwsh
        working-directory: li-calendar-custom
        run: pnpm tauri build

      - name: Collect installer
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "$env:GITHUB_WORKSPACE\release" | Out-Null
          $installer = Get-ChildItem "$env:GITHUB_WORKSPACE\li-calendar-custom\src-tauri\target\release\bundle\nsis\*.exe" | Select-Object -First 1
          if (-not $installer) { throw 'NSIS installer was not generated.' }
          Copy-Item $installer.FullName "$env:GITHUB_WORKSPACE\release\liCalendar_1.0.0_custom_x64-setup.exe"

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: liCalendar-custom-windows
          path: release/liCalendar_1.0.0_custom_x64-setup.exe
          if-no-files-found: error
